name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One workflow run at a time per branch; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: type-check + unit tests. Runs on every push and PR.
  check:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (fail on high/critical vulns)
        run: npm ci --audit --audit-level=high

      - name: Typecheck (renderer + main + preload)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # Full Windows installer. Only on pushes to main / version tags, so PRs stay fast.
  build-windows:
    name: Build Windows (NSIS)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + package (NSIS)
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotowork-windows
          path: release/*.exe
          if-no-files-found: warn
